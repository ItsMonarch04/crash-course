name: campaigns

# Run the bounded campaign suite for both proposed changes and mainline pushes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: theater/.nvmrc
      - run: node scripts/check-version-coherence.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          components: rustfmt, clippy
      - run: cargo test --locked --workspace --release
      - run: cargo run --locked -p cc-swarm -- --determinism-seeds 100
      - run: cargo run --locked -p cc-swarm -- run --profile calm --seeds 1000 --jobs 2
      - run: cargo run --locked -p cc-swarm -- run --profile rough --seeds 10000 --jobs 4
      # Each profile asserts the state it exists to reach so a clean campaign
      # cannot hide loss of its headline behavior.
      - run: cargo run --locked -p cc-swarm -- run --profile membership --seeds 10000 --jobs 4 --require-beacon membership-change
      - run: cargo run --locked -p cc-swarm -- run --profile wipe --seeds 2000 --jobs 4 --require-beacon snapshot-install
      - run: cargo run --locked -p cc-swarm -- run --profile brutal --seeds 2000 --jobs 4 --require-beacon disk-loss
      - run: cargo run --locked -p cc-swarm -- run --profile batch --seeds 10000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile follower-read --seeds 10000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile follower-read-v2 --seeds 2000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile stale-read --seeds 2000 --jobs 4
      # Every selectable profile is gated. `campaign-coverage.mjs` fails if a
      # new profile is added without a corresponding command here.
      - run: cargo run --locked -p cc-swarm -- run --profile gentle --seeds 2000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile corruption --seeds 2000 --jobs 4 --require-beacon network-drop
      - run: cargo run --locked -p cc-swarm -- run --profile starve --seeds 2000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile ttl --seeds 2000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- regress
      - run: ./scripts/ci/sim-throughput.sh
      - run: ./scripts/ci/porcupine-crosscheck.sh

  membership-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
      # Repeat the README's first demo to exercise startup and replay races.
      - run: bash scripts/ci/repeat-demo.sh --runs 8
      - run: CC_MEMBERSHIP_RUNS=20 bash scripts/demo-membership.sh
