name: campaigns

# This is the heaviest gate in the repository, and work lands directly on
# `main` rather than through pull requests. A `pull_request`-only trigger
# therefore never fires: the campaigns, the beacon assertions, and the
# porcupine crosscheck would sit in the workflow list contributing nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: node scripts/check-version-coherence.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo test --locked --workspace --release
      - run: cargo run --locked -p cc-swarm -- --determinism-seeds 100
      - run: cargo run --locked -p cc-swarm -- run --profile calm --seeds 1000 --jobs 2
      - run: cargo run --locked -p cc-swarm -- run --profile rough --seeds 10000 --jobs 4
      # Each profile asserts the state it exists to reach. Without these a
      # profile can stop exercising its own headline behaviour and still report
      # a clean campaign — which is exactly how `snapshot-install` stayed dark.
      - run: cargo run --locked -p cc-swarm -- run --profile membership --seeds 10000 --jobs 4 --require-beacon membership-change
      - run: cargo run --locked -p cc-swarm -- run --profile wipe --seeds 2000 --jobs 4 --require-beacon snapshot-install
      - run: cargo run --locked -p cc-swarm -- run --profile brutal --seeds 2000 --jobs 4 --require-beacon disk-loss
      - run: cargo run --locked -p cc-swarm -- run --profile batch --seeds 10000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile follower-read --seeds 10000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile follower-read-v2 --seeds 2000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- run --profile stale-read --seeds 2000 --jobs 4
      - run: cargo run --locked -p cc-swarm -- regress
      - run: ./scripts/ci/sim-throughput.sh
      - run: ./scripts/ci/porcupine-crosscheck.sh

  membership-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
      - run: CC_MEMBERSHIP_RUNS=20 bash scripts/demo-membership.sh
