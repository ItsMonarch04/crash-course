name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: node scripts/check-version-coherence.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./scripts/ci/forbidden-grep.sh
      - run: cargo test --workspace --all-targets
      # Exhaustive, not sampled: this asserts the log<=4 / term<=3 / messages<=8
      # envelope closes without hitting the state cap. It fails loudly if a
      # change to `cc-raft` makes the reachable state space grow.
      - run: cargo run --release -p cc-swarm -- model-check
      - run: cargo doc --workspace --no-deps
