name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  core-mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: node scripts/mutation-test.mjs --limit 25
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: artifacts/mutation-score.json
