name: determinism

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  double-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo run -p cc-swarm -- --determinism > trace-a.cctrace
      - run: cargo run -p cc-swarm -- --determinism > trace-b.cctrace
      - run: cmp trace-a.cctrace trace-b.cctrace
  cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo run -p cc-swarm -- --determinism > trace-${{ matrix.os }}.cctrace
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: trace-${{ matrix.os }}.cctrace
  compare:
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          path: traces
          merge-multiple: true
      - run: cmp traces/trace-ubuntu-latest.cctrace traces/trace-macos-14.cctrace
