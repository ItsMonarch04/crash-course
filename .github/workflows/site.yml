name: theater-site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "theater/**"
      - "exhibits/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: node scripts/check-version-coherence.mjs
      - run: node scripts/ci/control-contract.mjs
      - run: node scripts/ci/contrast.mjs
      - run: node scripts/ci/contrast-fixture.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: theater/.nvmrc
          cache: npm
          cache-dependency-path: theater/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: theater
      - run: cargo test --locked -p cc-wasm
      - run: rustup target add wasm32-unknown-unknown
      - run: CARGO_HTTP_MULTIPLEXING=false cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: ./scripts/build-wasm.sh
      - run: ./scripts/ci/wasm-equivalence.sh
      - run: npm run build
        working-directory: theater
      - run: ./scripts/ci/site-budget.sh
      # Playwright ships no browser with the npm package, and the runner image
      # has none it can use. Without this the whole e2e suite fails to launch,
      # which fails `build` and so never reaches the Pages deployment below.
      - run: npx playwright install --with-deps chromium
        working-directory: theater
      - run: npm run test:e2e
        working-directory: theater
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: theater/dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
