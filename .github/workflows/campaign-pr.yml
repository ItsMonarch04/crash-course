name: campaign-pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  bounded-campaigns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-version-coherence.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo test --workspace --release
      - run: cargo run -p cc-swarm -- --determinism-seeds 100
      - run: cargo run -p cc-swarm -- run --profile calm --seeds 1000 --jobs 2
      - run: cargo run -p cc-swarm -- run --profile rough --seeds 10000 --jobs 4
      - run: cargo run -p cc-swarm -- run --profile membership --seeds 10000 --jobs 4
      - run: cargo run -p cc-swarm -- regress
      - run: ./scripts/ci/sim-throughput.sh
      - run: ./scripts/ci/porcupine-crosscheck.sh
