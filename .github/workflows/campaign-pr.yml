name: campaign-pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  bounded-campaigns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-version-coherence.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo test --workspace --release
      - run: cargo run -p cc-swarm -- --determinism-seeds 100
      - run: cargo run -p cc-swarm -- run --profile calm --seeds 1000 --jobs 2
      - run: cargo run -p cc-swarm -- run --profile rough --seeds 10000 --jobs 4
      # Each profile asserts the state it exists to reach. Without these a
      # profile can stop exercising its own headline behaviour and still report
      # a clean campaign — which is exactly how `snapshot-install` stayed dark.
      - run: cargo run -p cc-swarm -- run --profile membership --seeds 10000 --jobs 4 --require-beacon membership-change
      - run: cargo run -p cc-swarm -- run --profile wipe --seeds 2000 --jobs 4 --require-beacon snapshot-install
      - run: cargo run -p cc-swarm -- run --profile brutal --seeds 2000 --jobs 4 --require-beacon disk-loss
      - run: cargo run -p cc-swarm -- regress
      - run: ./scripts/ci/sim-throughput.sh
      - run: ./scripts/ci/porcupine-crosscheck.sh
