name: Bug report
description: Report a reproducible correctness or tooling problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, seed, profile, and smallest trace or scenario.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build or commit
    validations:
      required: true
