[package]
name = "cc-node"
version.workspace = true
edition.workspace = true
description = "The ccdb lab host: RESP listener, CRC-checked journal, and TCP replication."
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
cc-core = { path = "../cc-core" }
cc-env = { path = "../cc-env" }
cc-kv = { path = "../cc-kv" }
cc-resp = { path = "../cc-resp" }
cc-store = { path = "../cc-store" }

[[bin]]
name = "ccdb"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Host crate: reads real clocks and spawns real threads by design.
disallowed_types = "allow"
