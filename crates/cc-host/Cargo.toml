[package]
name = "cc-host"
version.workspace = true
edition.workspace = true
description = "Shared bounded host driver for Crash Course nodes."
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
kata03 = []

[dependencies]
cc-cluster = { path = "../cc-cluster" }
cc-core = { path = "../cc-core" }
cc-env = { path = "../cc-env" }
cc-log = { path = "../cc-log" }
cc-store = { path = "../cc-store" }
cc-kv = { path = "../cc-kv" }

[dev-dependencies]
cc-raft = { path = "../cc-raft" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Host adapter: FileBlockSource measures actual blocking service time by design.
disallowed_types = "allow"
