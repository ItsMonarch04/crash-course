[package]
name = "cc-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cc-core = { path = "../cc-core" }
cc-sim = { path = "../cc-sim" }

[[bin]]
name = "cc-bench"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Host crate: reads real clocks and spawns real threads by design.
disallowed_types = "allow"

