[package]
name = "cc-detlint"
version.workspace = true
edition.workspace = true
description = "Zero-dependency determinism scanner and double-run harness."
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "cc-detlint"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Host crate: reads real clocks and spawns real threads by design.
disallowed_types = "allow"
