[workspace]
resolver = "3"
members = [
    "crates/cc-core",
    "crates/cc-env",
    "crates/cc-sim",
    "crates/cc-wal",
    "crates/cc-store",
    "crates/cc-raft",
    "crates/cc-kv",
    "crates/cc-cluster",
    "crates/cc-resp",
    "crates/cc-checker",
    "crates/cc-swarm",
    "crates/cc-node",
    "crates/cc-wasm",
    "crates/cc-bench",
]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "allow"
pedantic = "allow"
